<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login | Maharshi Medical Equipment</title>
<link rel="stylesheet" href="assets/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="nav">
  <a class="brand" href="index.html">Maharshi <span>Medical</span> Equipment</a>
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="shop.html">Shop</a>
    <a href="repair.html">Repair Service</a>
    <a href="login.html"><i class="fa-solid fa-user"></i> Login / Register</a>
    <a href="checkout.html"><i class="fa-solid fa-cart-arrow-down"></i> <span id="cart-count" class="cart-badge">0</span></a>
  </nav>
</header>

<div class="main-wrapper">
  <div class="page-header">
    <div class="page-header-inner">
      <h1>My Account</h1>
      <p>Log in to track orders, request repairs, and manage your profile</p>
    </div>
  </div>

  <main class="container" style="max-width: 500px; margin-top: 4rem;">
    <div class="section-card fade-up">
      
      <!-- Form Toggle -->
      <div class="auth-tabs" style="display: flex; margin-bottom: 2rem; border-bottom: 2px solid var(--border-light);">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')" style="flex: 1; padding: 1rem; background: none; border: none; font-weight: 600; color: var(--primary); border-bottom: 2px solid var(--primary); cursor: pointer;">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')" style="flex: 1; padding: 1rem; background: none; border: none; font-weight: 500; color: var(--text-muted); cursor: pointer;">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" onsubmit="handleAuth(event, 'login')">
        <div class="field-group">
          <label class="field-label">Email Address</label>
          <input type="email" name="email" class="field-input" placeholder="you@example.com" required />
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input type="password" name="password" class="field-input" placeholder="••••••••" required />
        </div>
        <button class="btn" type="submit" id="login-btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--primary-light); cursor: pointer;">Forgot Password?</p>
      </form>

      <!-- Register Form (Hidden by default) -->
      <form id="register-form" class="auth-form" style="display: none;" onsubmit="handleAuth(event, 'register')">
        <div class="field-group">
          <label class="field-label">Full Name</label>
          <input type="text" name="name" class="field-input" placeholder="Your name" required />
        </div>
        <div class="field-group">
          <label class="field-label">Email Address</label>
          <input type="email" name="email" class="field-input" placeholder="you@example.com" required />
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input type="password" name="password" class="field-input" placeholder="Create a strong password" required />
        </div>
        <button class="btn" type="submit" id="register-btn" style="width: 100%; margin-top: 1rem;">Create Account</button>
      </form>

      <div id="auth-result" style="margin-top: 1.5rem;"></div>

    </div>
  </main>

  <footer style="margin-top: auto;">&copy; 2026 Maharshi Medical Equipment</footer>
</div>

<script>
  // Update Cart Count
  function updateGlobalCount() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    document.getElementById('cart-count').textContent = cart.reduce((s,i)=>s+i.quantity, 0);
  }
  updateGlobalCount();

  // Switch between Login and Register Tabs
  function switchTab(tab) {
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    
    const loginTab = document.getElementById('tab-login');
    const regTab = document.getElementById('tab-register');
    
    if (tab === 'login') {
      loginTab.style.color = 'var(--primary)';
      loginTab.style.borderBottom = '2px solid var(--primary)';
      loginTab.style.fontWeight = '600';
      regTab.style.color = 'var(--text-muted)';
      regTab.style.borderBottom = 'none';
      regTab.style.fontWeight = '500';
    } else {
      regTab.style.color = 'var(--primary)';
      regTab.style.borderBottom = '2px solid var(--primary)';
      regTab.style.fontWeight = '600';
      loginTab.style.color = 'var(--text-muted)';
      loginTab.style.borderBottom = 'none';
      loginTab.style.fontWeight = '500';
    }
    document.getElementById('auth-result').style.display = 'none';
  }

  // Handle Form Submission
  async function handleAuth(e, action) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const resultDiv = document.getElementById('auth-result');
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    btn.disabled = true;
    resultDiv.style.display = 'block';
    resultDiv.className = 'loading';
    resultDiv.textContent = 'Processing...';

    try {
      // Connects to your backend API
      const API_URL = (location.port === '5001' ? '' : 'http://localhost:5001') + '/api/auth/' + action;
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const resData = await response.json();
      
      if (!response.ok) throw new Error(resData.error || 'Authentication failed');

      // Success
      resultDiv.className = 'success';
      resultDiv.textContent = action === 'login' ? '✅ Logged in successfully!' : '🎉 Account created successfully!';
      
      // Save token (if your backend returns one)
      if (resData.token) localStorage.setItem('token', resData.token);
      
      // Redirect to profile or home page after short delay
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);

    } catch (err) {
      resultDiv.className = 'error';
      resultDiv.textContent = err.message;
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
